<script id="securityRules" type="text/plain">
rules_version = '2';
service cloud.firestore {
 match /databases/{database}/documents {
  function verified() { return request.auth != null && request.auth.token.email_verified == true; }
  function owner() { return verified() && request.auth.token.email == 'dayyanirene@gmail.com'; }
  function accountant() { return verified() && exists(/databases/$(database)/documents/accountingUsers/$(request.auth.token.email)) && get(/databases/$(database)/documents/accountingUsers/$(request.auth.token.email)).data.active == true; }
  match /accountingUsers/{email} {
   allow read: if owner() || (verified() && request.auth.token.email == email);
   allow create, update: if owner() && request.resource.data.keys().hasOnly(['name','email','active']) && request.resource.data.email == email && request.resource.data.name is string && request.resource.data.name.size() > 0 && request.resource.data.name.size() <= 120 && request.resource.data.active is bool;
   allow delete: if false;
  }
  match /accountingV2/main {
   allow read: if owner() || accountant();
   allow create, update: if owner() && request.resource.data.schema == 2 && request.resource.data.state is map;
   allow delete: if false;
  }
  match /accountingRequests/{id} {
   allow read: if owner() || (accountant() && resource.data.by == request.auth.token.email);
   allow create: if accountant() && request.resource.data.keys().hasOnly(['by','name','status','payload','at']) && request.resource.data.by == request.auth.token.email && request.resource.data.status == 'pending' && request.resource.data.name is string && request.resource.data.at is string && request.resource.data.payload is map && request.resource.data.payload.action in ['cash','document','journal','settle','contact','asset','depreciate','reconcile','import'];
   allow update: if owner() || (accountant() && resource.data.by == request.auth.token.email && resource.data.status == 'returned' && request.resource.data.status == 'pending' && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['payload','status','at']) && request.resource.data.payload is map && request.resource.data.payload.action in ['cash','document','journal','settle','contact','asset','depreciate','reconcile','import']);
   allow delete: if false;
  }
 }
}
</script>
<script>
// UI and accounting code are local; Firebase is loaded dynamically with visible error handling.
                                                          
                                                             
                                                                                                        
                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                                                                                                                                                       
const baseAccounts          =[['1000','Bank utama','asset'],['1010','Tunai / petty cash','asset'],['1100','Penghutang perdagangan','asset'],['1200','Inventori','asset'],['1500','Aset tetap','asset'],['1590','Susut nilai terkumpul','asset'],['2000','Pemiutang perdagangan','liability'],['2100','Pinjaman bank','liability'],['3000','Modal pemilik','equity'],['3100','Untung terkumpul / baki awal','equity'],['3200','Ambilan pemilik','equity'],['4000','Pendapatan / jualan','income'],['4100','Pulangan jualan','income'],['5000','Kos jualan','expense'],['5100','Gaji','expense'],['5110','Komisen','expense'],['5120','Bonus','expense'],['5200','Sewa','expense'],['5300','Utiliti & telefon','expense'],['5400','Profesional & lesen','expense'],['5500','Pembaikan & penyelenggaraan','expense'],['5600','Pemasaran','expense'],['5700','Perjalanan','expense'],['5800','Caj bank & faedah','expense'],['5900','Perbelanjaan lain','expense'],['5950','Susut nilai','expense']].map(([code,name,type])=>({code,name,type}));
const money=(n       )=>new Intl.NumberFormat('ms-MY',{style:'currency',currency:'MYR'}).format((n||0)/100);
const balance=(s      ,code       ,to='9999-12-31',from='0000-01-01')=>s.entries.filter(e=>e.date<=to&&e.date>=from).reduce((n,e)=>n+e.lines.filter(l=>l.account===code).reduce((t,l)=>t+l.debit-l.credit,0),0);
function totals(s      ,from='0000-01-01',to='9999-12-31'){const sum=(type       )=>s.accounts.filter(a=>a.type===type).reduce((n,a)=>n+balance(s,a.code,to,from),0);return {income:-sum('income'),expenses:sum('expense'),profit:-sum('income')-sum('expense'),cash:balance(s,'1000',to)+balance(s,'1010',to),receivable:balance(s,'1100',to),payable:-balance(s,'2000',to)||0};}
function initialState(imports      )      {return {company:{name:'DASUKI MOTORS',ssm:'',address:'',lockDate:''},accounts:baseAccounts.map(a=>({...a})),entries:[],documents:[],contacts:[],assets:[],imports,audit:[],reconciliations:[]};}
const fail=(m       )      =>{throw new Error(m)};
function str(v        ,max=300){return typeof v==='string'&&v.trim()&&v.length<=max?v.trim():fail('Sila lengkapkan maklumat yang diperlukan.');}
function date(v        ){const d=str(v,10);if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||!Number.isFinite(Date.parse(d))||new Date(d).toISOString().slice(0,10)!==d)fail('Tarikh tidak sah.');return d;}
function amount(v        ){return Number.isSafeInteger(v)&&Number(v)>0&&Number(v)<1e12?Number(v):fail('Jumlah mesti positif dan maksimum 2 titik perpuluhan.');}
function account(s      ,v       ){return s.accounts.find(a=>a.code===v)||fail('Akaun tidak sah.');}
function post(s      ,p    ){const d=date(p.date);if(s.company.lockDate&&d<=s.company.lockDate)fail('Tempoh ini telah dikunci.');const lines       =p.lines;if(!Array.isArray(lines)||lines.length<2||lines.length>100)fail('Jurnal memerlukan sekurang-kurangnya dua baris.');let dr=0,cr=0;for(const l of lines){account(s,l.account);if(!Number.isSafeInteger(l.debit)||!Number.isSafeInteger(l.credit)||l.debit<0||l.credit<0||l.debit>1e12||l.credit>1e12||Boolean(l.debit)===Boolean(l.credit))fail('Setiap baris mesti mempunyai debit atau kredit.');dr+=l.debit;cr+=l.credit;}if(dr!==cr||!dr)fail('Jumlah debit dan kredit mesti seimbang.');const e      ={id:crypto.randomUUID(),date:d,description:str(p.description),ref:p.ref?str(p.ref,100):'JV-'+String(s.entries.length+1).padStart(5,'0'),lines,...(p.reversalOf?{reversalOf:p.reversalOf}:{})};s.entries.push(e);return e;}
const pair=(debit       ,credit       ,n       )       =>[{account:debit,debit:n,credit:0},{account:credit,debit:0,credit:n}];
function invoiceAmounts(p){
 const valid=v=>Number.isSafeInteger(v)&&v>=0&&v<1e12;
 if(!valid(p.parts)||!valid(p.labour))fail(t('Jumlah alat ganti dan upah mesti sah dan tidak negatif.','Parts and labour must be valid non-negative amounts.'));
 const subtotal=p.parts+p.labour,tax=Math.round(p.labour*8/100),total=subtotal+tax;
 amount(total);return {parts:p.parts,labour:p.labour,subtotal,tax,taxRate:8,total};
}
function sstAccount(s){
 let a=s.accounts.find(a=>a.systemKey==='sstPayable');
 if(!a){let code;for(let n=2200;n<=2299;n++)if(!s.accounts.some(a=>a.code===String(n))){code=String(n);break}if(!code)fail('No free SST account code (2200–2299).');a={code,name:'SST payable / SST belum bayar',type:'liability',systemKey:'sstPayable'};s.accounts.push(a)}
 if(a.type!=='liability')fail(t('Akaun SST mesti jenis liabiliti.','The SST account must be a liability.'));return a.code;
}
function invoicePrintRows(d){return d.sst?[ [esc(d.description),''],[t('Alat ganti','Parts'),money(d.sst.parts)],[t('Upah','Labour'),money(d.sst.labour)],[t('Jumlah sebelum SST','Subtotal before SST'),money(d.sst.subtotal)],['SST '+d.sst.taxRate+'% '+t('(upah sahaja)','(labour only)'),money(d.sst.tax)],[t('Jumlah termasuk SST','Total including SST'),money(d.amount)],[t('Dibayar','Paid'),money(d.paid)],[t('Baki','Balance'),money(d.amount-d.paid)]]:[[esc(d.description),money(d.amount)],[t('Dibayar','Paid'),money(d.paid)],[t('Baki','Balance'),money(d.amount-d.paid)]]}
function applyAction(s      ,p    ,actor       )      {
 switch(p.action){
 case 'contact':s.contacts.push({id:crypto.randomUUID(),name:str(p.name),kind:['Pelanggan','Pembekal'].includes(p.kind)?p.kind:fail('Jenis tidak sah.'),email:typeof p.email==='string'?p.email.slice(0,200):''});break;
 case 'account':{const code=str(p.code,10);if(!/^\d{4,6}$/.test(code)||s.accounts.some(a=>a.code===code))fail('Kod akaun mesti unik (4–6 digit).');if(!['asset','liability','equity','income','expense'].includes(p.type))fail('Jenis akaun tidak sah.');s.accounts.push({code,name:str(p.name),type:p.type});break;}
 case 'accountEdit':{
 if(actor!==ADMIN)fail('Admin only');
 const a=account(s,str(p.originalCode,10));
 // Codes remain immutable: system defaults and separate staff requests also reference them.
 if(p.code!==a.code)fail(t('Kod akaun tidak boleh diubah.','Account codes cannot be changed.'));
 if(!p.before||['code','name','type'].some(k=>p.before[k]!==a[k]))fail(t('Akaun telah berubah. Tutup dan buka semula borang edit.','This account has changed. Close and reopen the edit form.'));
 const name=str(p.name),type=p.type;
 if(!['asset','liability','equity','income','expense'].includes(type))fail(t('Jenis akaun tidak sah.','Invalid account type.'));
 if(name===a.name&&type===a.type)fail(t('Tiada perubahan untuk disimpan.','There are no changes to save.'));
 const before={code:a.code,name:a.name,type:a.type};
 if(a.systemKey==='sstPayable'&&type!=='liability')fail(t('Akaun SST mesti kekal sebagai liabiliti.','The SST account must remain a liability.'));a.name=name;a.type=type;
 s.audit.push({at:new Date().toISOString(),actor,action:'accountEdit',before,after:{code:a.code,name:a.name,type:a.type}});
 return s;
 }
 case 'journal':post(s,p);break;
 case 'cash':{const n=amount(p.amount);if(!['1000','1010'].includes(p.bank)||p.account===p.bank)fail('Pilih akaun tunai/bank yang sah.');post(s,{...p,lines:p.direction==='in'?pair(p.bank,p.account,n):pair(p.account,p.bank,n)});break;}
 case 'document':{const kind=p.kind;if(!['invoice','bill'].includes(kind))fail('Jenis dokumen tidak sah.');const breakdown=kind==='invoice'&&('parts'in p||'labour'in p)?invoiceAmounts(p):null;const n=breakdown?breakdown.total:amount(p.amount),d=date(p.date),due=date(p.due);if(due<d)fail('Tarikh akhir tidak boleh sebelum tarikh dokumen.');const a=account(s,p.account);if(kind==='invoice'&&a.type!=='income')fail('Pilih akaun pendapatan.');if(kind==='bill'&&!['expense','asset'].includes(a.type))fail('Pilih akaun kos atau aset.');const number=str(p.number,80);if(s.documents.some(x=>x.kind===kind&&x.number===number))fail('Nombor dokumen telah digunakan.');const contact=str(p.contact);const lines=breakdown?[{account:'1100',debit:n,credit:0},{account:p.account,debit:0,credit:breakdown.subtotal},...(breakdown.tax?[{account:sstAccount(s),debit:0,credit:breakdown.tax}]:[])]:kind==='invoice'?pair('1100',p.account,n):pair(p.account,'2000',n);post(s,{...p,ref:number,lines});s.documents.push({id:crypto.randomUUID(),kind,number,date:d,due,contact,description:str(p.description),amount:n,account:p.account,paid:0,...(breakdown?{sst:breakdown,sstRegistration:s.company.sstRegistration||''}:{})});break;}
 case 'settle':{const d=s.documents.find(x=>x.id===p.id)||fail('Dokumen tidak ditemui.');const n=amount(p.amount);if(n>d.amount-d.paid)fail('Bayaran melebihi baki dokumen.');if(date(p.date)<d.date)fail('Tarikh bayaran sebelum dokumen.');if(!['1000','1010'].includes(p.bank))fail('Akaun bank tidak sah.');post(s,{date:p.date,description:'Bayaran '+d.number,ref:d.number,lines:d.kind==='invoice'?pair(p.bank,'1100',n):pair('2000',p.bank,n)});d.paid+=n;break;}
 case 'reverse':{const e=s.entries.find(e=>e.id===p.id)||fail('Jurnal tidak ditemui.');if(s.documents.some(d=>d.number===e.ref)||e.ref.startsWith('DEP-')||e.reversalOf||s.entries.some(x=>x.reversalOf===e.id))fail(t('Jurnal ini tidak boleh diterbalikkan di sini. Gunakan jurnal pelarasan bagi dokumen.','This journal entry cannot be reversed here. Use an adjusting journal entry for documents.'));post(s,{date:p.date,description:'Pembalikan: '+str(p.reason),reversalOf:e.id,lines:e.lines.map(l=>({account:l.account,debit:l.credit,credit:l.debit}))});break;}
 case 'import':{const r=s.imports.find(r=>r.id===p.id)||fail('Rekod tidak ditemui.');if(r.posted)fail('Rekod sudah dipos.');if(!['1000','1010'].includes(p.bank)||p.account===p.bank)fail('Akaun tidak sah.');post(s,{date:p.date,description:r.description,ref:'XLS-ROW-'+r.row,lines:pair(p.account,p.bank,r.amount)});r.posted=true;r.postedDate=p.date;r.postedAccount=p.account;break;}

async function saveAction(p,rid){checkAction(structuredClone(S),p);if(demo){if(role==='admin')S=checkAction(structuredClone(S),p);else if(rid){const r=requests.find(x=>x.id===rid);if(r.status!=='returned')throw Error('Already reviewed');r.payload=p;r.status='pending'}else requests.push({id:crypto.randomUUID(),by:user.email,name:profile,payload:p,status:'pending',at:new Date().toISOString()});draw();return}if(role==='admin'){const ref=F.doc(db,'accountingV2','main');await F.runTransaction(db,async tx=>{const snap=await tx.get(ref);if(!snap.exists()||snap.data().schema!==2)throw Error('Accounting V2 state unavailable');const state=snap.data().state;checkAction(state,p);tx.set(ref,packed(state))})}else if(rid){await F.updateDoc(F.doc(db,'accountingRequests',rid),{payload:p,status:'pending',at:new Date().toISOString()})}else await F.addDoc(F.collection(db,'accountingRequests'),{by:user.email,name:profile,payload:p,status:'pending',at:new Date().toISOString()})}

async function review(id,approve){const reason=$('reason')?.value.trim()||'';if(!approve&&!reason)throw Error(t('Catatan pembetulan diperlukan.','Correction note is required.'));if(role!=='admin')throw Error('Admin only');if(demo){const r=requests.find(x=>x.id===id);if(r.status!=='pending')throw Error('Already reviewed');if(approve)S=checkAction(structuredClone(S),r.payload);r.status=approve?'approved':'returned';r.reason=reason;draw();return}const rr=F.doc(db,'accountingRequests',id),sr=F.doc(db,'accountingV2','main');await F.runTransaction(db,async tx=>{const r=await tx.get(rr),s=await tx.get(sr);if(!r.exists()||r.data().status!=='pending')throw Error(t('Rekod telah disemak.','Record has already been reviewed.'));if(approve){const state=s.data().state;checkAction(state,r.data().payload);state.audit.push({at:new Date().toISOString(),actor:user.email,action:'Approved '+id+' / '+r.data().by});tx.set(sr,packed(state))}tx.update(rr,{status:approve?'approved':'returned',reason,reviewedBy:user.email,reviewedAt:new Date().toISOString()})})}

function csv(){const cells=r=>r.map(v=>'"'+String(v).replace(/^[=+@-]/,"'").replace(/"/g,'""')+'"').join(',');const rows=[['Date','Reference','Description','Account','Debit RM','Credit RM'],...visibleEntries().flatMap(e=>e.lines.map(l=>[e.date,e.ref,e.description,l.account,(l.debit/100).toFixed(2),(l.credit/100).toFixed(2)]))];download('dasuki-ledger.csv','\uFEFF'+rows.map(cells).join('\r\n'),'text/csv')}
function parseCSV(text){text=text.replace(/^\uFEFF/,'');let rows=[],row=[],cell='',quote=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quote&&text[i+1]==='"'){cell+='"';i++}else quote=!quote}else if(c===','&&!quote){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quote){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell=''}else cell+=c}if(quote)throw Error('CSV: unclosed quote');row.push(cell);if(row.some(x=>x.trim()))rows.push(row);return rows}
async function stageCSV(text){const rows=parseCSV(text),header=rows.shift()?.map(x=>x.trim().toLowerCase());if(!header||header.join(',')!=='date,description,amount')throw Error('CSV header must be: date,description,amount');if(rows.length>200)throw Error(t('Maksimum 200 baris setiap import.','Maximum 200 rows per import.'));const hash=[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text)))].map(x=>x.toString(16).padStart(2,'0')).join('');return rows.map((r,i)=>{if(r.length!==3||!r[1].trim()||r[1].length>300)throw Error('Invalid CSV row '+(i+2));if(r[0].trim())date(r[0].trim());const n=parseMoney(r[2]);amount(n);return {id:hash+'-'+i,row:i+2,date:r[0].trim(),description:r[1].trim(),amount:n,allocations:[],source:hash,posted:false}})}
function importModal(){modal(t('Import pembayaran CSV','Import payment CSV'),`<p>${t('Header wajib: date,description,amount. Tarikh YYYY-MM-DD atau kosong; jumlah positif dalam RM. Maksimum 200 baris.','Required header: date,description,amount. Date YYYY-MM-DD or blank; positive amount in RM. Maximum 200 rows.')}</p>${button(t('Muat turun contoh','Download template'),'csvtemplate')}<input id="csvFile" type="file" accept=".csv"><div id="csvPreview"></div>`);$('csvFile').onchange=async e=>{try{const rows=await stageCSV(await e.target.files[0].text());$('csvPreview').innerHTML=table(['Date','Description','RM'],rows.map(r=>[esc(r.date||'—'),esc(r.description),money(r.amount)]))+button(t('Simpan ke semakan import','Save to import review'),'stagecsv');$('csvPreview').querySelector('button').onclick=()=>guard(async()=>{if(role!=='admin')throw Error('Admin only');const add=state=>{if(state.imports.some(r=>r.source===rows[0]?.source))throw Error(t('Fail ini sudah diimport.','This file was already imported.'));state.imports.push(...rows);state.audit.push({at:new Date().toISOString(),actor:user.email,action:'CSV staged: '+rows.length});return state};if(demo){S=add(structuredClone(S));draw()}else{const ref=F.doc(db,'accountingV2','main');await F.runTransaction(db,async tx=>{const s=await tx.get(ref);tx.set(ref,packed(add(s.data().state)))})}$('modal').close()})}catch(e){notice(explain(e))}}}
function setup(){modal(t('Panduan persediaan V2','V2 setup guide'),`<ol><li>${t('Upload fail ini sebagai index.html ke GitHub Pages.','Upload this file as index.html to GitHub Pages.')}</li><li>${t('Aktifkan Google dan Email/Password dalam Firebase Authentication. Tambah domain dayyanirene.github.io.','Enable Google and Email/Password in Firebase Authentication. Add domain dayyanirene.github.io.')}</li><li>${t('Cloud Firestore → Rules: gantikan rules lama dengan kod di bawah, kemudian Publish. Rules ini menutup akses aplikasi lama; hentikan penggunaan versi lama semasa pertukaran. Data lama kekal.','Cloud Firestore → Rules: replace old rules with the code below and Publish. These rules close old-app access; stop using the old version during transition. Existing data remains.')}</li><li>${t('Log masuk admin dayyanirene@gmail.com dan tekan Mulakan akaun V2. Daftar accountant dalam Staf & kelulusan.','Sign in as admin dayyanirene@gmail.com and Initialize V2. Register accountants in Staff & approvals.')}</li><li>${t('Import pembayaran melalui CSV untuk semakan. Sistem tidak menganggap rekod lama sebagai transaksi dipos.','Import payments through CSV for review. Old records are not treated as posted transactions automatically.')}</li></ol><div class="notice">${t('Versi ini mempunyai had satu dokumen akaun dan kawalan saiz. Ia bukan sistem ERP berskala besar; perlu audit keselamatan dan ujian pengguna sebelum kegunaan kewangan sebenar. Rules melindungi peranan; logik posting dijalankan dalam browser admin dipercayai.','This edition has a single accounting document and a size guard. It is not a large-scale ERP; security review and user acceptance testing are needed before real financial use. Rules enforce roles; posting logic runs in the trusted admin browser.')}</div><textarea id="rulesText" readonly rows="14"></textarea><p>${button(t('Salin rules','Copy rules'),'copyrules')}${button(t('Download rules','Download rules'),'downloadrules')}</p>`);$('rulesText').value=$('securityRules').textContent.trim()}
function preview(){demo=true;clearSession();demo=true;user={email:ADMIN,emailVerified:true};role='admin';profile='Admin Haily';ready=true;S=initialState([]);S.company.name='DASUKI MOTORS SDN BHD';applyAction(S,{action:'journal',date:'2026-09-01',description:'DEMO: Opening capital',lines:pair('1000','3000',1000000)},ADMIN);applyAction(S,{action:'document',kind:'invoice',date:'2026-09-02',due:'2026-09-30',number:'DEMO-INV-001',contact:'Pelanggan contoh / Sample customer',description:'DEMO: Service',account:'4000',amount:35000},ADMIN);draw()}
async function authAction(action){if(!auth)throw Error(t('Firebase belum tersedia. Semak internet / hosting HTTPS.','Firebase is not ready. Check internet / HTTPS hosting.'));if(action==='google'){await A.signInWithPopup(auth,new A.GoogleAuthProvider());return}const f=$('loginForm');const email=f?.elements.email.value.trim(),password=f?.elements.password.value;if(!email)throw Error(t('Isi e-mel dahulu.','Enter your email first.'));if(action==='reset'){await A.sendPasswordResetEmail(auth,email);notice(t('Jika akaun layak, e-mel pemulihan akan dihantar. Semak spam.','If eligible, a reset email will be sent. Check spam.'));return}if(action==='register'){const c=await A.createUserWithEmailAndPassword(auth,email,password);await A.sendEmailVerification(c.user);notice(t('Semak peti masuk untuk pengesahan e-mel.','Check your inbox to verify your email.'));return}await A.signInWithEmailAndPassword(auth,email,password)}

document.addEventListener('click',async e=>{const b=e.target.closest('[data-do]');if(!b||b.disabled)return;const a=b.dataset.do,id=b.dataset.id;try{if(a==='bm'||a==='en'){lang=a;try{localStorage.setItem('dasuki-lang',lang)}catch{}document.documentElement.lang=lang==='bm'?'ms':'en';if($('modal').open){notice(t('Bahasa akan digunakan selepas borang ditutup.','Language will apply after the form is closed.'));return}if(S)draw();else if(user)gate(t('Tekan Semak semula.','Press Retry.'));else drawLogin(t('Sila log masuk.','Please sign in.'));return}if(a==='close'){$('modal').close();return}if(a==='setup'){setup();return}if(a==='copyrules'){try{await navigator.clipboard.writeText($('securityRules').textContent.trim());notice(t('Rules disalin.','Rules copied.'))}catch{$('rulesText').select();notice(t('Tekan Ctrl+C.','Press Ctrl+C.'))}return}if(a==='downloadrules'){download('firestore-v2.rules',$('securityRules').textContent.trim());return}if(a==='demo'){preview();return}if(['google','register','reset'].includes(a)){await authAction(a);return}if(a==='logout'){clearSession();user=null;if(demo){demo=false;drawLogin();if(auth?.currentUser)await A.signOut(auth)}else{drawLogin();await A.signOut(auth)}return}if(a==='verify'){await A.sendEmailVerification(auth.currentUser);notice(t('E-mel dihantar.','Email sent.'));return}if(a==='retry'){await A.reload(auth.currentUser);await A.getIdToken(auth.currentUser,true);await enter(auth.currentUser);return}if(a==='initialize'){if(role!=='admin')throw Error('Admin only');const ref=F.doc(db,'accountingV2','main');await F.runTransaction(db,async tx=>{const s=await tx.get(ref);if(!s.exists())tx.set(ref,packed(initialState([])))});return}if(!S)return;if(a==='page'){page=id;search='';draw();return}if(a==='editaccount'){if(role!=='admin')throw Error('Admin only');form('accountEdit',{...account(S,id)});return}if(a==='form'){form(id,id==='settings'?S.company:{});return}if(a==='addline'){$('journalLines').insertAdjacentHTML('beforeend',journalLine({account:'5900',debit:0,credit:0}));return}if(a==='removeline'){b.closest('.journalrow').remove();return}if(a==='settle'){const d=S.documents.find(d=>d.id===id);form('settle',{id,amount:d.amount-d.paid});return}if(a==='depreciate'){form('depreciate',{id});return}if(a==='entry'){const en=S.entries.find(x=>x.id===id);if(!en)throw Error(t('Transaksi tidak ditemui.','Transaction not found.'));modal(t('Rekod transaksi','Transaction record')+' · '+esc(en.ref),`<h2>${esc(S.company.name)}</h2><p>${esc(S.company.ssm)}<br>${esc(S.company.address)}</p><p><strong>${t('Tarikh','Date')}:</strong> ${esc(en.date)}<br><strong>${t('Rujukan','Reference')}:</strong> ${esc(en.ref)}</p><p>${esc(en.description)}</p>${table([t('Kod / akaun','Code / account'),'Debit (RM)','Credit (RM)'],en.lines.map(l=>[esc(l.account)+' · '+an(l.account),money(l.debit),money(l.credit)]).concat([[t('Jumlah','Total'),money(en.lines.reduce((sum,l)=>sum+l.debit,0)),money(en.lines.reduce((sum,l)=>sum+l.credit,0))]]))}<div class="actions no-print">${button(t('Cetak / PDF','Print / PDF'),'print')}${role==='admin'?button(t('Jurnal pembalikan','Reverse entry'),'reverse',id):''}</div>`);return}if(a==='reverse'){form('reverse',{id});return}if(a==='printdoc'){const d=S.documents.find(x=>x.id===id);modal(esc(d.number),`<h2>${esc(S.company.name)}</h2><p>${esc(S.company.ssm)}<br>${esc(S.company.address)}</p>${d.sst?`<p>${t('No. pendaftaran SST','SST registration no.')}: ${esc(d.sstRegistration||t('Belum diisi','Not entered'))}</p>`:''}<h2>${d.kind==='invoice'?t('INVOIS','INVOICE'):t('BIL PEMBEKAL','SUPPLIER BILL')}</h2><p>${esc(d.contact)}<br>${d.date} → ${d.due}</p>${table([t('Butiran','Description'),'RM'],invoicePrintRows(d) )}${button(t('Cetak / PDF','Print / PDF'),'print')}`);return}if(a==='print'){window.print();return}if(a==='csv'){csv();return}if(a==='backup'){download('dasuki-backup-'+dateNow()+'.json',JSON.stringify({schema:2,exportedAt:new Date().toISOString(),state:S,requests,members},null,2),'application/json');return}if(a==='request'){requestModal(id);return}if(a==='approve'||a==='return'){await guard(async()=>{await review(id,a==='approve');$('modal').close()});return}if(a==='resubmit'){const r=requests.find(x=>x.id===id);form(r.payload.action,r.payload,id);return}if(a==='member'){memberForm(id);return}if(a==='importcsv'){importModal();return}if(a==='csvtemplate'){download('payments-template.csv','date,description,amount\n2026-09-01,Sample payment,100.00\n','text/csv');return}if(a==='importrow'){const r=S.imports.find(x=>x.id===id);form('import',r);return}}catch(e){notice(explain(e))}});
