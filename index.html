<!doctype html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#102a43">
  <title>DASMOT ACCOUNTING</title>
  <style>
    :root{--navy:#102a43;--blue:#1e5eff;--teal:#11a683;--ink:#16324f;--muted:#718096;--line:#e6edf4;--bg:#f5f8fb;--danger:#c53030;--amber:#b7791f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}.app{min-height:100vh}.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#eff8ff,#f6fbf8)}.login-card{width:min(460px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:36px;box-shadow:0 20px 60px #16324f18;text-align:center}.brand-mark{width:54px;height:54px;border-radius:16px;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:27px;font-weight:800;margin:0 auto 18px}.brand-mark span{color:#57d3b1}.login h1{margin:0;color:var(--navy);font-size:26px}.login p{color:var(--muted);line-height:1.6}.google{width:100%;padding:13px 18px;border-radius:12px;background:#fff;color:var(--ink);border:1px solid #ccd7e3;font-weight:700}.google:hover{background:#f7fafc}.small{font-size:12px;color:var(--muted)}.shell{display:flex;min-height:100vh}.side{width:250px;background:var(--navy);color:#fff;padding:24px 16px;display:flex;flex-direction:column;gap:24px}.side-brand{font-size:18px;font-weight:800;padding:0 12px}.side-brand span{display:block;color:#70e0bf;font-size:11px;letter-spacing:2px;margin-top:3px}.company{background:#ffffff14;border:1px solid #ffffff1c;padding:13px;border-radius:14px;font-size:13px}.company b{display:block;margin-bottom:4px}.company small{color:#b9c9d8}.nav{display:grid;gap:7px}.nav button{padding:12px 13px;border-radius:10px;background:transparent;color:#cfe0ed;text-align:left}.nav button.active,.nav button:hover{background:#ffffff18;color:#fff}.side-bottom{margin-top:auto;color:#abc0d0;font-size:12px}.main{flex:1;min-width:0}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 30px}.user{display:flex;align-items:center;gap:10px}.avatar{width:35px;height:35px;border-radius:50%;display:grid;place-items:center;background:#d9f6ed;color:#08765d;font-weight:800;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.content{max-width:1240px;margin:auto;padding:32px}.heading{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:26px}.heading h1{font-size:28px;margin:4px 0 7px;color:var(--navy)}.eyebrow{font-size:11px;color:var(--teal);font-weight:800;letter-spacing:1.5px;margin:0}.muted{color:var(--muted)}.actions{display:flex;gap:9px;flex-wrap:wrap}.primary,.secondary,.danger{border-radius:10px;padding:11px 15px;font-weight:700}.primary{background:var(--blue);color:#fff}.primary:hover{filter:brightness(.94)}.secondary{background:#fff;color:var(--ink);border:1px solid #d6e0ea}.danger{background:#fff0f0;color:var(--danger)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}.card,.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}.stat small{display:block;color:var(--muted);margin-bottom:11px}.stat strong{font-size:25px;color:var(--navy)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card h2{font-size:17px;margin:0 0 5px}.card p{margin-top:0}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:650px}.table th,.table td{text-align:left;border-bottom:1px solid var(--line);padding:13px 10px;vertical-align:top}.table th{color:var(--muted);font-size:12px;font-weight:700}.badge{display:inline-block;border-radius:999px;background:#fff6dc;color:var(--amber);font-size:12px;padding:5px 9px;font-weight:700}.badge.ok{background:#e3f8f0;color:#08765d}.badge.returned{background:#fff0f0;color:var(--danger)}.notice{padding:13px 15px;border-radius:11px;background:#eef5ff;color:#24517e;margin:14px 0}.notice.error{background:#fff0f0;color:var(--danger)}.empty{text-align:center;color:var(--muted);padding:25px}.form{display:grid;gap:14px}.field{display:grid;gap:6px}.field label,.field>span{font-size:12px;font-weight:700;color:var(--muted)}.field input,.field select,.field textarea{width:100%;border:1px solid #d5e0e9;border-radius:9px;padding:11px 12px;background:#fff;color:var(--ink)}.field textarea{min-height:90px;resize:vertical}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form-grid .full{grid-column:1/-1}.modal{position:fixed;inset:0;background:#08233c66;display:grid;place-items:center;padding:20px;z-index:10}.modal-box{background:#fff;border-radius:18px;width:min(560px,100%);max-height:90vh;overflow:auto;padding:25px}.modal-head{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:20px}.modal-head h2{margin:0}.close{background:#eef3f7;color:var(--ink);width:32px;height:32px;border-radius:50%;font-size:20px}.right{text-align:right}.loading{padding:30px;text-align:center;color:var(--muted)}@media(max-width:850px){.side{width:210px}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.content{padding:22px}.top{padding:0 20px}}@media(max-width:600px){.shell{display:block}.side{width:auto;padding:15px;gap:12px}.side .nav{display:flex;overflow:auto}.side .nav button{white-space:nowrap}.side-bottom{display:none}.top{height:62px}.heading{display:block}.heading .actions{margin-top:15px}.stats{gap:10px}.stat,.card{padding:15px}.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}}
  </style>

<body>
    <div id="login" class="login"><div class="login-card"><div class="brand-mark">D<span>.</span></div><h1>DASMOT ACCOUNTING</h1><p>Sistem perakaunan Dasuki Motors Sdn Bhd untuk majikan dan staf.</p><button id="loginBtn" class="google">Masuk dengan Google</button><div style="display:flex;align-items:center;gap:10px;margin:18px 0;color:#718096;font-size:12px"><span style="height:1px;background:#e6edf4;flex:1"></span>ATAU<span style="height:1px;background:#e6edf4;flex:1"></span></div><form id="emailLoginForm" class="form" style="text-align:left"><div class="field"><span>E-mel</span><input id="loginEmail" type="email" required placeholder="nama@email.com"></div><div class="field"><span>Password</span><input id="loginPassword" type="password" minlength="6" required placeholder="Minimum 6 aksara"></div><button class="primary" type="submit">Log masuk dengan password</button></form><div class="actions" style="justify-content:center;margin-top:12px"><button id="registerBtn" class="secondary">Daftar akaun baharu</button><button id="resetBtn" class="secondary">Lupa password</button></div><p id="loginError" class="notice error hidden"></p><p class="small">Data disimpan dengan Cloud Firestore.</p></div></div>
  <div id="app" class="app hidden"></div>
  <div id="modal" class="modal hidden"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
    import { getFirestore, collection, doc, getDoc, setDoc, updateDoc, addDoc, deleteDoc, query, where, orderBy, onSnapshot, serverTimestamp, arrayUnion, arrayRemove, writeBatch } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDeTbW_YfLmNUi5fMON_zmXSnI7cFOhr_8",
      authDomain: "dasmot-accounting.firebaseapp.com",
      databaseURL: "https://dasmot-accounting-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "dasmot-accounting",
      storageBucket: "dasmot-accounting.firebasestorage.app",
      messagingSenderId: "202079675461",
      appId: "1:202079675461:web:5b3e28c73466ef418d2f2c2"
    };
    const ADMIN_EMAIL = "dayyanirene@gmail.com";
    const COMPANY_PATH = ["companies", "dasuki"];
    const appFirebase = initializeApp(firebaseConfig);
    const auth = getAuth(appFirebase);
    const db = getFirestore(appFirebase);
    const provider = new GoogleAuthProvider();
    const $ = id => document.getElementById(id);
    const state = { user:null, role:null, profileName:'', company:null, submissions:[], ledger:[], members:[], stop:[] };
    const money = cents => new Intl.NumberFormat("ms-MY",{style:"currency",currency:"MYR"}).format((Number(cents)||0)/100);
    const esc = value => String(value ?? "").replace(/[&<>"']/g, x => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[x]));
    const today = () => new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Kuala_Lumpur"});
    const initials = name => String(name||"U").split(/\s+/).map(x=>x[0]).join("").slice(0,2).toUpperCase();
    const statusBadge = status => `<span class="badge ${status==='approved'?'ok':status==='returned'?'returned':''}">${status==='pending'?'Menunggu semakan':status==='approved'?'Diluluskan':'Perlu pembetulan'}</span>`;
    function showError(message){ alert(message); }
    function stopListeners(){ state.stop.forEach(fn=>fn()); state.stop=[]; }
    function closeModal(){ $("modal").classList.add("hidden"); $("modal").innerHTML=""; }
    function openModal(title,body){ $("modal").innerHTML=`<div class="modal-box"><div class="modal-head"><h2>${title}</h2><button class="close" id="closeModal">×</button></div>${body}</div>`;$("modal").classList.remove("hidden");$("closeModal").onclick=closeModal; }
    function renderShell(){
      const admin = state.role === "admin"; const displayName = state.profileName || state.user.displayName || state.user.email;
      $("app").innerHTML = `<div class="shell"><aside class="side"><div class="side-brand">DASMOT<span>ACCOUNTING</span></div><div class="company"><b>Dasuki Motors Sdn Bhd</b><small>${admin?'Ruang majikan / admin':'Accountant syarikat'}</small></div><nav class="nav"><button data-page="dashboard" class="active">▦ Dashboard</button><button data-page="transactions">↔ Transaksi</button><button data-page="invoices">▤ Invois jualan</button><button data-page="bills">▧ Bil pembekal</button><button data-page="bank">▣ Tunai & bank</button><button data-page="journal">≡ Jurnal & lejar</button><button data-page="contacts">♙ Pelanggan & pembekal</button><button data-page="assets">▱ Aset tetap</button><button data-page="reports">▥ Laporan</button><button data-page="imports">⇧ Semakan import</button>${admin?'<button data-page="review">✓ Staf & kelulusan</button><button data-page="team">♙ Pasukan</button>':'<button data-page="my-records">✓ Staf & kelulusan</button>'}<button data-page="settings">⚙ Tetapan</button></nav><div class="side-bottom">Cloud Firestore realtime<br><span id="connection">Menyambung...</span></div></aside><main class="main"><header class="top"><b id="pageTitle">Gambaran keseluruhan</b><div class="user"><div class="avatar">${state.user.photoURL?`<img src="${esc(state.user.photoURL)}">`:initials(displayName)}</div><span>${esc(displayName)}</span><button class="secondary" id="logout">Keluar</button></div></header><section class="content" id="view"></section></main></div>`;
      document.querySelectorAll("[data-page]").forEach(btn=>btn.onclick=()=>renderPage(btn.dataset.page)); $("logout").onclick=()=>signOut(auth); renderPage("dashboard");
    }
    function renderPage(page){ document.querySelectorAll("[data-page]").forEach(x=>x.classList.toggle("active",x.dataset.page===page)); const titles={dashboard:"Gambaran kewangan anda",transactions:"Semua transaksi",invoices:"Invois jualan",bills:"Bil pembekal",bank:"Tunai & bank",journal:"Jurnal & lejar",contacts:"Pelanggan & pembekal",assets:"Daftar aset tetap",reports:"Laporan kewangan",imports:"Semak rekod import",review:"Staf & kelulusan",team:"Pasukan",settings:"Tetapan perniagaan",'my-records':'Staf & kelulusan'}; $("pageTitle").textContent=titles[page]||"DASMOT ACCOUNTING"; if(page==='dashboard')dashboard(); else if(page==='review')reviewPage(); else if(page==='team')teamPage(); else if(page==='my-records')staffPage(); else modulePage(page); }
    function modulePage(page){
      const config={transactions:['Transaksi','Catatan tunai, bank dan transaksi yang telah diluluskan.'],invoices:['Invois jualan','Urus invois kepada pelanggan.'],bills:['Bil pembekal','Urus bil dan bayaran pembekal.'],bank:['Tunai & bank','Semak baki tunai dan bank.'],journal:['Jurnal & lejar','Lihat catatan debit dan kredit.'],contacts:['Pelanggan & pembekal','Direktori kenalan perniagaan.'],assets:['Aset tetap','Daftar aset dan susut nilai.'],reports:['Laporan kewangan','Lihat ringkasan kewangan syarikat.'],imports:['Semakan import','Semak transaksi pembayaran yang perlu disahkan.'],settings:['Tetapan perniagaan','Profil syarikat dan akses pengguna.']}[page]||['DASMOT ACCOUNTING',''];
      const records=state.ledger.slice().reverse();
      const filtered=page==='invoices'?records.filter(x=>x.type==='invoice'):page==='bills'?records.filter(x=>x.type==='bill'):page==='journal'?records.filter(x=>x.type==='journal'):page==='imports'?records:records;
      const rows=filtered.length?filtered.map(x=>`<tr><td>${esc(x.date||'-')}</td><td>${esc(x.reference||'-')}</td><td>${esc(x.description||'-')}</td><td>${esc(x.byName||x.by||'-')}</td><td>${money(x.amount||0)}</td><td><span class="badge ok">Diluluskan</span></td></tr>`).join(''):'<tr><td colspan="6"><div class="empty">Belum ada rekod untuk modul ini.</div></td></tr>';
      const importBox=page==='imports'?`<div class="notice"><b>Import rekod lama</b><br><span class="small">Rekod lama perlu dimasukkan ke Firestore. Admin boleh tambah rekod menggunakan butang transaksi baharu.</span></div>`:'';
      $("view").innerHTML=`<div class="heading"><div><p class="eyebrow">DASMOT MOTORS / PERAKAUNAN</p><h1>${config[0]}</h1><p class="muted">${config[1]}</p></div><div class="actions"><button class="primary" id="moduleAction">+ Tambah rekod</button></div></div>${importBox}<section class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Tarikh</th><th>Rujukan</th><th>Butiran</th><th>Pengguna</th><th>Jumlah</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div></section><div class="grid"><section class="card"><h2>Ringkasan</h2><p class="muted">${filtered.length} rekod dalam modul ini.</p><strong style="font-size:25px;color:var(--navy)">${money(filtered.reduce((n,x)=>n+Number(x.amount||0),0))}</strong></section><section class="card"><h2>Akses accountant</h2><p class="muted">Accountant boleh melihat rekod dan menghantar transaksi. Kelulusan serta lejar hanya boleh diubah oleh admin.</p></section></div>`;
      $("moduleAction").onclick=()=>recordModal();
    }
    function dashboard(){ const pending=state.submissions.filter(x=>x.status==='pending').length; const approved=state.submissions.filter(x=>x.status==='approved').length; const total=state.ledger.reduce((n,x)=>n+Number(x.amount||0),0); const displayName=state.profileName||state.user.displayName||state.user.email; $("view").innerHTML=`<div class="heading"><div><p class="eyebrow">DASMOT MOTORS / PERAKAUNAN</p><h1>Selamat datang, ${esc(displayName)}</h1><p class="muted">Data dikemas kini secara realtime.</p></div><div class="actions"><button class="primary" id="newRecord">+ Hantar rekod</button></div></div><div class="stats"><div class="stat"><small>Menunggu semakan</small><strong>${pending}</strong></div><div class="stat"><small>Rekod diluluskan</small><strong>${approved}</strong></div><div class="stat"><small>Jumlah lejar</small><strong>${money(total)}</strong></div><div class="stat"><small>Staf aktif</small><strong>${state.members.filter(x=>x.active!==false).length}</strong></div></div><div class="grid"><section class="card"><h2>Aktiviti terkini</h2><p class="muted">Hantaran staf dan transaksi syarikat.</p>${state.submissions.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Tarikh</th><th>Butiran</th><th>Jumlah</th><th>Status</th></tr></thead><tbody>${state.submissions.slice(-6).reverse().map(x=>`<tr><td>${esc(x.date||x.createdAtText||'')}</td><td>${esc(x.description)}<br><span class="small">${esc(x.by)}</span></td><td>${money(x.amount)}</td><td>${statusBadge(x.status)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Belum ada rekod.</div>'}</section><section class="card"><h2>Aliran kerja</h2><p class="muted">Admin semak setiap rekod sebelum masuk ke lejar.</p><div class="notice">${state.role==='admin'?'Gunakan menu Semakan staf untuk lulus atau pulangkan rekod.':'Hantar rekod melalui butang Hantar rekod dan tunggu semakan majikan.'}</div></section></div>`; $("newRecord").onclick=()=>recordModal(); }
    function recordModal(existing=null){
      const p=existing||{};
      openModal(existing?'Betulkan rekod':'Rekod accounting baru',`<form id="recordForm" class="form"><div class="form-grid"><div class="field"><span>Tarikh</span><input name="date" type="date" value="${esc(p.date||today())}" required></div><div class="field"><span>Modul</span><select name="type"><option value="cash">Transaksi tunai / bank</option><option value="invoice">Invois jualan</option><option value="bill">Bil pembekal</option><option value="journal">Jurnal pelarasan</option></select></div><div class="field full"><span>Butiran transaksi</span><input name="description" value="${esc(p.description||'')}" required placeholder="Contoh: Pembayaran minyak syarikat"></div><div class="field"><span>Jumlah (RM)</span><input name="amount" type="number" min="0.01" step="0.01" value="${p.amount?Number(p.amount/100).toFixed(2):''}" required></div><div class="field"><span>Rujukan / no. dokumen</span><input name="reference" value="${esc(p.reference||'')}" placeholder="No. resit, invois atau jurnal"></div></div><p class="small">${state.role==='admin'?'Rekod admin akan disimpan terus ke lejar.':'Rekod accountant akan dihantar kepada admin untuk semakan.'}</p><div id="recordError" class="notice error hidden"></div><button class="primary" type="submit">${state.role==='admin'?'Simpan ke lejar':'Hantar untuk semakan'}</button></form>`);
      $("recordForm").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const data={date:String(f.get('date')),type:String(f.get('type')),description:String(f.get('description')),amount:Math.round(Number(f.get('amount'))*100),reference:String(f.get('reference')||''),by:state.user.email,byName:state.profileName||state.user.displayName||state.user.email,createdAt:serverTimestamp(),createdAtText:new Date().toLocaleString('ms-MY')};try{if(state.role==='admin'){await addDoc(collection(db,'ledger'),{...data,approvedBy:state.user.email,status:'approved'});}else{await addDoc(collection(db,'submissions'),{...data,status:'pending'});}closeModal();}catch(err){const el=$("recordError");el.textContent=err.message;el.classList.remove('hidden');}};
    }
    function reviewPage(){ const rows=state.submissions.filter(x=>x.status==='pending'||x.status==='returned'); $("view").innerHTML=`<div class="heading"><div><p class="eyebrow">KAWALAN MAJIKAN</p><h1>Semakan staf</h1><p class="muted">Luluskan transaksi selepas semak tarikh, butiran dan jumlah.</p></div></div><section class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Staf</th><th>Tarikh</th><th>Butiran</th><th>Jumlah</th><th>Status</th><th></th></tr></thead><tbody>${rows.length?rows.map(x=>`<tr><td>${esc(x.byName||x.by)}<br><span class="small">${esc(x.by)}</span></td><td>${esc(x.date)}</td><td>${esc(x.description)}</td><td>${money(x.amount)}</td><td>${statusBadge(x.status)}</td><td><button class="secondary" data-review="${x.id}">Semak</button></td></tr>`).join(''):'<tr><td colspan="6"><div class="empty">Tiada rekod menunggu semakan.</div></td></tr>'}</tbody></table></div></section>`; document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>reviewModal(state.submissions.find(x=>x.id===b.dataset.review))); }
    function reviewModal(record){ if(!record)return; openModal('Semakan rekod staf',`<div class="notice">${statusBadge(record.status)}</div><div class="card"><p><b>Staf:</b> ${esc(record.byName||record.by)} (${esc(record.by)})</p><p><b>Tarikh:</b> ${esc(record.date)}</p><p><b>Butiran:</b> ${esc(record.description)}</p><p><b>Jumlah:</b> ${money(record.amount)}</p><p><b>Rujukan:</b> ${esc(record.reference||'-')}</p></div>${record.status==='pending'?`<div class="field"><span>Catatan jika dipulangkan</span><textarea id="returnReason" placeholder="Contoh: Sila betulkan tarikh atau kategori."></textarea></div><div class="actions right"><button class="danger" id="returnRecord">Pulangkan</button><button class="primary" id="approveRecord">Lulus & masuk lejar</button></div>`:''}`); if(record.status==='pending'){$("returnRecord").onclick=async()=>{const reason=$("returnReason").value.trim();if(!reason)return showError('Sila masukkan catatan pembetulan.');await updateDoc(doc(db,'submissions',record.id),{status:'returned',reason,reviewedBy:state.user.email,reviewedAt:serverTimestamp()});closeModal();};$("approveRecord").onclick=async()=>{try{const batch=writeBatch(db);const ledgerRef=doc(collection(db,'ledger'));batch.set(ledgerRef,{submissionId:record.id,date:record.date,description:record.description,amount:record.amount,by:record.by,approvedBy:state.user.email,createdAt:serverTimestamp()});batch.update(doc(db,'submissions',record.id),{status:'approved',reviewedBy:state.user.email,reviewedAt:serverTimestamp(),ledgerId:ledgerRef.id});await batch.commit();closeModal();}catch(err){showError(err.message);}}} }
    function teamPage(){ $("view").innerHTML=`<div class="heading"><div><p class="eyebrow">AKSES PENGGUNA</p><h1>Pasukan</h1><p class="muted">Tambahkan e-mel Google staf yang dibenarkan.</p></div><button class="primary" id="addStaff">+ Daftar staf</button></div><section class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Nama</th><th>E-mel</th><th>Status</th><th></th></tr></thead><tbody>${state.members.length?state.members.map(x=>`<tr><td>${esc(x.name||'-')}</td><td>${esc(x.email)}</td><td><span class="badge ${x.active===false?'returned':'ok'}">${x.active===false?'Tidak aktif':'Aktif'}</span></td><td>${x.active===false?`<button class="secondary" data-enable="${esc(x.email)}">Aktifkan</button>`:`<button class="danger" data-disable="${esc(x.email)}">Nyahaktifkan</button>`}</td></tr>`).join(''):'<tr><td colspan="4"><div class="empty">Belum ada staf.</div></td></tr>'}</tbody></table></div></section>`; $("addStaff").onclick=()=>staffModal();document.querySelectorAll('[data-disable]').forEach(b=>b.onclick=async()=>updateMember(b.dataset.disable,false));document.querySelectorAll('[data-enable]').forEach(b=>b.onclick=async()=>updateMember(b.dataset.enable,true)); }
    function staffModal(){openModal('Daftar staf',`<form id="staffForm" class="form"><div class="field"><span>Nama staf</span><input name="name" required></div><div class="field"><span>E-mel Google staf</span><input name="email" type="email" required></div><p class="small">Staf mesti menggunakan e-mel Google yang sama semasa log masuk.</p><button class="primary">Daftar staf</button></form>`);$("staffForm").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const email=String(f.get('email')).trim().toLowerCase();if(email===ADMIN_EMAIL)return showError('E-mel admin tidak boleh didaftarkan sebagai staf.');try{const name=String(f.get('name')).trim();await updateDoc(doc(db,...COMPANY_PATH),{staffEmails:arrayUnion(email),staffNames:{...(state.company?.staffNames||{}),[email]:name}});await setDoc(doc(db,'staffProfiles',email),{email,name,active:true,createdAt:serverTimestamp()});closeModal();}catch(err){showError(err.message);}};}
    async function updateMember(email,active){try{await updateDoc(doc(db,...COMPANY_PATH),{staffEmails:active?arrayUnion(email):arrayRemove(email)});await setDoc(doc(db,'staffProfiles',email),{email,name:state.company?.staffNames?.[email]||email,active,updatedAt:serverTimestamp()},{merge:true});}catch(err){showError(err.message);}}
    function ledgerPage(){ $("view").innerHTML=`<div class="heading"><div><p class="eyebrow">REKOD DILULUSKAN</p><h1>Lejar</h1><p class="muted">Hanya rekod yang diluluskan oleh admin dipaparkan.</p></div></div><section class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Tarikh</th><th>Butiran</th><th>Staf</th><th>Jumlah</th><th>Admin</th></tr></thead><tbody>${state.ledger.length?state.ledger.slice().reverse().map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.description)}</td><td>${esc(x.by)}</td><td>${money(x.amount)}</td><td>${esc(x.approvedBy)}</td></tr>`).join(''):'<tr><td colspan="5"><div class="empty">Belum ada rekod diluluskan.</div></td></tr>'}</tbody></table></div></section>`; }
    function staffPage(){ const rows=state.submissions;$("view").innerHTML=`<div class="heading"><div><p class="eyebrow">RUANG STAF</p><h1>Hantaran saya</h1><p class="muted">Semua rekod akan disemak oleh majikan.</p></div><button class="primary" id="newStaffRecord">+ Hantar rekod</button></div><section class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Tarikh</th><th>Butiran</th><th>Jumlah</th><th>Status</th><th>Catatan</th></tr></thead><tbody>${rows.length?rows.slice().reverse().map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.description)}</td><td>${money(x.amount)}</td><td>${statusBadge(x.status)}</td><td>${esc(x.reason||'')}</td></tr>`).join(''):'<tr><td colspan="5"><div class="empty">Belum ada hantaran.</div></td></tr>'}</tbody></table></div></section>`; $("newStaffRecord").onclick=()=>recordModal(); }
    function startListeners(){ stopListeners(); const isAdmin=state.role==='admin'; const sq=isAdmin?query(collection(db,'submissions'),orderBy('createdAt','asc')):query(collection(db,'submissions'),where('by','==',state.user.email)); state.stop.push(onSnapshot(sq,s=>{state.submissions=s.docs.map(d=>({id:d.id,...d.data()}));if($("app")&&!$("app").classList.contains('hidden'))renderPage(document.querySelector('.nav button.active')?.dataset.page||'dashboard');},e=>showError('Tidak dapat membaca submissions: '+e.message))); state.stop.push(onSnapshot(doc(db,'staffProfiles',state.user.email),s=>{if(s.exists()){state.profileName=s.data().name||'';if(state.role==='staff')renderShell();}})); state.stop.push(onSnapshot(collection(db,'ledger'),s=>{state.ledger=s.docs.map(d=>({id:d.id,...d.data()}));renderPage(document.querySelector('.nav button.active')?.dataset.page||'dashboard');},e=>showError('Tidak dapat membaca lejar: '+e.message))); if(isAdmin){state.stop.push(onSnapshot(doc(db,...COMPANY_PATH),s=>{if(s.exists()){state.company=s.data();state.members=(s.data().staffEmails||[]).map(email=>({email,name:s.data().staffNames?.[email]||email,active:true}));renderPage(document.querySelector('.nav button.active')?.dataset.page||'dashboard');}}));} $("connection").textContent='Disambungkan'; }
    async function enter(user){state.user=user;state.role=user.email.toLowerCase()===ADMIN_EMAIL?'admin':'staff';$("login").classList.add('hidden');$("app").classList.remove('hidden');renderShell();startListeners();}
    function authError(e){const messages={'auth/invalid-credential':'E-mel atau password tidak betul.','auth/email-already-in-use':'E-mel ini sudah mempunyai akaun. Cuba log masuk.','auth/weak-password':'Password mesti sekurang-kurangnya 6 aksara.','auth/invalid-email':'Format e-mel tidak sah.','auth/too-many-requests':'Terlalu banyak cubaan. Cuba lagi kemudian.'};$("loginError").textContent=messages[e.code]||e.message;$("loginError").classList.remove('hidden');}
    $("loginBtn").onclick=async()=>{try{await signInWithPopup(auth,provider);}catch(e){authError(e);}};
    $("emailLoginForm").onsubmit=async e=>{e.preventDefault();$("loginError").classList.add('hidden');try{await signInWithEmailAndPassword(auth,$("loginEmail").value.trim(),$("loginPassword").value);}catch(err){authError(err);}};
    $("registerBtn").onclick=async()=>{const email=$("loginEmail").value.trim(),password=$("loginPassword").value;if(!email||password.length<6){$("loginError").textContent='Masukkan e-mel dan password minimum 6 aksara dahulu.';$("loginError").classList.remove('hidden');return;}try{await createUserWithEmailAndPassword(auth,email,password);}catch(e){authError(e);}};
    $("resetBtn").onclick=async()=>{const email=$("loginEmail").value.trim();if(!email){$("loginError").textContent='Masukkan e-mel dahulu untuk menerima pautan reset password.';$("loginError").classList.remove('hidden');return;}try{await sendPasswordResetEmail(auth,email);$("loginError").textContent='Pautan reset password telah dihantar ke e-mel anda.';$("loginError").className='notice';}catch(e){authError(e);}};
    onAuthStateChanged(auth,user=>{if(user)enter(user);else{$("login").classList.remove('hidden');$("app").classList.add('hidden');stopListeners();}});
  </script>
</body>
</html>
